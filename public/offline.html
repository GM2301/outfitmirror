<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Occaswear</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FAF8F5; color: #1A1A1A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; }
    .box { max-width: 320px; text-align: center; }
    p.brand { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #9A958C; margin: 0 0 32px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { font-size: 14px; color: #6B6B6B; line-height: 1.5; margin: 0 0 24px; }
    button { border: 0; border-radius: 12px; background: #1A1A1A; color: #fff; padding: 12px 24px; font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <p class="brand">Occaswear</p>
    <h1>You're offline</h1>
    <p>Occaswear needs an internet connection to load your wardrobe. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
